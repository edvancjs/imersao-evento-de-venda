<meta charset="UTF-8">

<title>Falta só um passo — Laboratório de Vendas no WhatsApp</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg-dark-1:#0b2016;--bg-dark-2:#143a24;--orange:#f2691c;--orange-deep:#d9500b;--ink:#15221a;--muted:#4d5f53;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;font-family:'Inter','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;background:linear-gradient(160deg,var(--bg-dark-1) 0%,var(--bg-dark-2) 100%);}
  .card{background:#fff;border-radius:22px;max-width:520px;width:100%;padding:34px 28px 28px;text-align:center;box-shadow:0 30px 60px -25px rgba(0,0,0,.6);}
  .avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;border:3px solid var(--orange);background:#000 url(img/lab/hero-a.jpg) 50% 17%/270% auto no-repeat;}
  h1{font-family:'Poppins',sans-serif;font-size:clamp(24px,5.5vw,30px);line-height:1.2;margin:0 0 14px;color:var(--ink);text-wrap:balance;}
  p{margin:0;font-size:17px;line-height:1.6;color:#33463a;}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:22px;padding:18px 22px;border-radius:12px;font-weight:700;font-size:15.5px;letter-spacing:.01em;color:#fff8f2;background:linear-gradient(180deg,var(--orange) 0%,var(--orange-deep) 100%);box-shadow:0 14px 30px -12px rgba(242,105,28,.55);text-decoration:none;}
  .dica{margin-top:20px;font-size:15px;color:var(--muted);}
</style>
</head>
<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PN3V3R4R" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<main class="card">
  <div class="avatar" role="img" aria-label="Edvan Jacques"></div>
  <h1>Falta só um passo: entrar na comunidade</h1>
  <p>Pronto<span id="nome"></span>! Agora toque no botão abaixo para entrar na comunidade desta semana. Dentro dela eu libero o conteúdo, a aula e o calendário completo.</p>
  <a class="btn" id="entrar" href="https://chat.whatsapp.com/LBR6yS4gsPyE7jQZhKHp2H">ENTRAR NA COMUNIDADE</a>
  <p class="dica"><strong>Dica:</strong> fixe a conversa e ative as notificações. Tudo o que acontece na semana.</p>
</main>
<script>
  // Personaliza o primeiro nome (?nome=... ou o que foi digitado no formulário). Sem nome, o texto fica genérico.
  (function(){
    var n = new URLSearchParams(location.search).get('nome');
    if(!n){ try { n = sessionStorage.getItem('lab_nome'); } catch(e){} }
    var el = document.getElementById('nome');
    if(n){ el.textContent = ', ' + n.trim().split(/\s+/)[0]; }
  })();
</script>
</body>
</html>
